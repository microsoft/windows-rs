[package]
name = "test_interop"
version = "0.0.0"
edition = "2024"
publish = false

# The library is the Rust component that fixture clients activate. Tests build it with a nested
# `cargo build` to get a DLL at a known path (see `tests/support/mod.rs`).
[lib]
crate-type = ["cdylib"]
doc = false
doctest = false
test = false

[dependencies]
windows-core = { workspace = true, default-features = true }
windows-collections = { workspace = true, features = ["std"] }
windows-future = { workspace = true, features = ["std"] }
windows-numerics = { workspace = true }
windows-reference = { workspace = true, features = ["std"] }
windows-time = { workspace = true, features = ["std"] }

[dev-dependencies]
cc = "1.0"
cppwinrt = { workspace = true }

[build-dependencies]
cppwinrt = { workspace = true }
windows-bindgen = { workspace = true }
windows-rdl = { workspace = true }

[lints]
workspace = true