[package]
name = "windows-reactor"
version = "0.100.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Declarative Windows UI library for Rust"
repository = "https://github.com/microsoft/windows-rs"
categories = ["os::windows-apis"]
readme = "readme.md"
exclude = [
    "public-api.txt",
    "src/core/component_tests.rs",
    "src/core/engine_tests.rs",
    "src/core/pump/tests",
    "src/native/winui/tests.rs",
    "src/test/recording_tests.rs",
]

[features]
test = []

[dependencies]
rustc-hash = { workspace = true }
windows-collections = { workspace = true, features = ["std"] }
windows-core = { workspace = true }
windows-future = { workspace = true }
windows-numerics = { workspace = true }
windows-reference = { workspace = true, features = ["std"] }
windows-threading = { workspace = true }
windows-time = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = []
