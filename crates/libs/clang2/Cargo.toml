[package]
name = "windows-clang2"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"
description = "Experimental native header capture"
readme = "readme.md"

[lints]
workspace = true

[dependencies]
windows-clang-sys = { workspace = true }
windows-rdl = { workspace = true, optional = true }
windows-metadata = { workspace = true, optional = true }
proc-macro2 = { workspace = true, optional = true }
quote = { workspace = true, optional = true }

[features]
projection = ["dep:windows-rdl", "dep:windows-metadata", "dep:proc-macro2", "dep:quote"]
