[package]
name = "windows-reference"
version = "0.101.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Windows reference type"
repository = "https://github.com/microsoft/windows-rs"
categories = ["os::windows-apis"]
readme = "readme.md"

[target.'cfg(windows)'.dependencies]
windows-core = { workspace = true, default-features = false, optional = true }
windows-time = { workspace = true, optional = true }

[features]
default = ["std"]
std = ["dep:windows-core", "windows-core/std", "dep:windows-time", "windows-time/std"]

[lints]
workspace = true

[package.metadata.docs.rs]
targets = []
