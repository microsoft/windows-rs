[package]
name = "windows-tracing-macros"
version = "0.100.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "The tracing macros for the Windows crates"
repository = "https://github.com/microsoft/windows-rs"
categories = ["os::windows-apis"]
readme = "readme.md"

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features = ["parsing", "proc-macro", "printing", "full"] }

[lints]
workspace = true

[package.metadata.docs.rs]
targets = []

[lib]
proc-macro = true
