[package]
name = "windows-webview"
version = "0.100.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Windows WebView2 library"
repository = "https://github.com/microsoft/windows-rs"
categories = ["os::windows-apis"]
readme = "readme.md"

[features]
xaml = ["dep:windows-future"]

[dependencies]
windows-core = { workspace = true }
windows-window = { workspace = true }
windows-future = { workspace = true, optional = true }

[lints]
workspace = true

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = []
features = ["xaml"]
