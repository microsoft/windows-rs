rationale = "The incumbent children capability is the Reactor Children relation."

[[capability]]
name = "items"
kind = "virtual_items"
rationale = "The incumbent items capability is a keyed container-realized virtual Items relation."

[[capability]]
name = "layout"
kind = "layout"
rationale = "Layout is represented by shared visual and attached properties plus exit transitions."

[[capability]]
name = "enabled"
kind = "schema_capability"
schema_capability = "enabled"
rationale = "Enabled support is declared once in the Reactor capability table."

[[capability]]
name = "focus"
kind = "schema_capability"
schema_capability = "focus"
rationale = "Focus support is declared once in the Reactor capability table."

[[capability]]
name = "reference"
kind = "schema_capability"
schema_capability = "reference"
rationale = "Typed reference support is declared once in the Reactor capability table."

[[capability]]
name = "tooltip_attachment"
kind = "schema_capability"
schema_capability = "tooltip_attachment"
rationale = "ToolTip placement became a declaration-owned attachment capability."

[[capability]]
name = "content_dialog_attachment"
kind = "schema_capability"
schema_capability = "content_dialog_attachment"
rationale = "ContentDialog lifecycle became a declaration-owned attachment capability."

[[capability]]
name = "window_title_bar"
kind = "schema_capability"
