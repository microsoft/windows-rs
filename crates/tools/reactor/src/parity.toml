[[capability]]
name = "text_style"
kind = "schema_capability"
schema_capability = "text_style"
rationale = "Shared text styling is declared once in the Reactor capability table."

[[capability]]
name = "controlled_text"
kind = "controlled_text"
rationale = "Controlled text is represented by generated feedback contracts on string properties."

[[capability]]
name = "grid_definitions"
kind = "property_adapters"
property_adapters = ["grid_rows", "grid_columns"]
rationale = "Grid row and column definitions are generated property adapters."

[[property]]
control = "Microsoft.UI.Xaml.Controls.ColorPicker"
name = "Color"
old_adapter = ""
new_adapter = "native_color"
rationale = "Reactor names the Color conversion explicitly at the generated native boundary."

[[property]]
control = "Microsoft.UI.Xaml.Controls.ListView"
name = "SelectedIndex"
old_feedback = "synchronous_exact"
new_feedback = "deferred_exact"
rationale = "Reactor waits for the native selection event because ListView applies selection asynchronously."

[[event_adapter]]
old_adapter = "rich_edit_text"
property_adapter = "rich_edit_text"
rationale = "RichEdit text events observe the property that owns the rich_edit_text adapter."

[[event_adapter]]
old_adapter = "content_dialog_result"
payload_adapter = "content_dialog_result"
schema_capability = "content_dialog_attachment"
rationale = "ContentDialog completion is emitted by the declaration-owned dialog attachment."

[[event_adapter]]
old_adapter = "pointer_event"
value = "PointerEventInfo"
rationale = "Pointer payload conversion is represented by the generated PointerEventInfo value."

[[event_adapter]]
old_adapter = "key_event"
value = "KeyEventInfo"
required_routed = true
rationale = "Key payload conversion is represented by a routed KeyEventInfo value."

[[event_adapter]]
old_adapter = "character_event"
value = "CharacterEventInfo"
required_routed = true
rationale = "Character payload conversion is represented by a routed CharacterEventInfo value."

[[event_adapter]]
old_adapter = "focus_event"
value = "FocusEventInfo"
rationale = "Focus payload conversion is represented by the generated FocusEventInfo value."

[[event_adapter]]
old_adapter = "drag_info"
value = "DragKind"
rationale = "Drag state conversion is represented by the generated DragKind value."

[[event_adapter]]
old_adapter = "drop_data"
value = "DroppedData"
rationale = "Drop payload conversion is represented by the generated DroppedData value."

[[event_adapter]]
old_adapter = "item_tags"
