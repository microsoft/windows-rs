name: Install WebView2 Evergreen runtime
description: Install the current WebView2 Evergreen runtime and check the installer result.
runs:
  using: composite
  steps:
    - shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $installerUrl = "https://go.microsoft.com/fwlink/p/?LinkId=2124703"
        $installerPath = Join-Path $env:RUNNER_TEMP "MicrosoftEdgeWebview2Setup.exe"
        Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath
        $installer = Start-Process -FilePath $installerPath `
          -ArgumentList "/silent", "/install" -Wait -PassThru
        if ($installer.ExitCode -ne 0) {
          throw "WebView2 installer exited with code $($installer.ExitCode)"
        }
