name: test_reactor_next

on:
  push:
    branches: [windows-reactor-next]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  quality:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Update toolchain
        run: rustup update --no-self-update stable nightly && rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Install public API tool
        run: cargo install cargo-public-api --locked --version 0.52.0

      - name: Format
        shell: pwsh
        run: |
          cargo fmt -p windows-reactor-next -p tool_reactor_next `
            -p test_reactor_next -p test_reactor_next_bench `
            -p test_reactor_next_selftest `
            -p sample_reactor_next_counter -p sample_reactor_next_controlled `
            -p sample_reactor_next_form -p sample_reactor_next_virtual `
            -p sample_reactor_next_navigation -- --check

      - name: Check and test
        shell: pwsh
        run: |
          cargo test -p windows-reactor-next -p tool_reactor_next `
            -p test_reactor_next -p sample_reactor_next_virtual `
            -p sample_reactor_next_navigation --quiet
          cargo check -p test_reactor_next_bench `
            -p sample_reactor_next_counter -p sample_reactor_next_controlled `
            -p sample_reactor_next_form --quiet
          cargo clippy -p windows-reactor-next -p tool_reactor_next `
            -p test_reactor_next -p test_reactor_next_bench `
            -p test_reactor_next_selftest `
            -p sample_reactor_next_counter -p sample_reactor_next_controlled `
            -p sample_reactor_next_form -p sample_reactor_next_virtual `
            -p sample_reactor_next_navigation `
            --all-targets --quiet

      - name: Live headless self-test
        run: cargo run -p test_reactor_next_selftest --quiet -- --headless

      - name: Generated output
        shell: pwsh
        run: |
          cargo run -p tool_reactor_next --quiet
          git diff --exit-code

      - name: Public API
        shell: pwsh
        run: |
          $actual = (cargo public-api -p windows-reactor-next -sss --color never |
            Out-String).Trim()
          $expected = (Get-Content crates\libs\reactor-next\public-api.txt -Raw).Trim()
          if ($actual -ne $expected) {
            throw "windows-reactor-next public API changed"
          }
