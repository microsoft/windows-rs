name: clippy

permissions:
  contents: read

on:
  pull_request:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - 'crates/libs/rdl/rdl.md'
      - 'docs/**'
  push:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - 'crates/libs/rdl/rdl.md'
      - 'docs/**'
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  clippy:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Update toolchain
        run: rustup update --no-self-update nightly && rustup default nightly-x86_64-pc-windows-msvc
      - name: Add toolchain target
        run: rustup target add x86_64-pc-windows-msvc
      - name: Install clippy
        run: rustup component add clippy
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Fix environment
        uses: ./.github/actions/fix-environment
        with:
          target: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Check
        # Exclusions (both due to --all-targets feature-unification across the workspace):
        #   test_no_std - unification pulls std into its no_std graph (duplicate panic_impl).
        #   windows-canvas, windows-composition, and the `system` Composition consumers - Reactor
        #     consumers enable their mutually exclusive `reactor` stacks in the unified workspace
        #     build. The default `system` stacks are linted in a separate pass.
        run:  cargo clippy --workspace --all-targets --exclude test_no_std --exclude windows-canvas --exclude windows-composition --exclude test_composition --exclude composition_standalone --exclude composition_minesweeper --exclude composition_canvas -- -D warnings
      - name: Check composition system stack
        # Canvas, Composition, and the `system` consumers are linted separately from the
        # reactor-primary workspace pass above.
        run:  cargo clippy -p windows-canvas -p windows-composition -p test_composition -p composition_standalone -p composition_minesweeper -p composition_canvas --all-targets -- -D warnings
