name: test-webview

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: webview-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  selftest:
    name: test-webview (x64 debug)
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update toolchain
        run: rustup update --no-self-update stable && rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Regenerate WebView bindings
        run: cargo run -p tool-webview --quiet && git diff --exit-code

      - name: Install WebView2 Evergreen runtime
        shell: pwsh
        run: |
          $installerUrl = "https://go.microsoft.com/fwlink/p/?LinkId=2124703"
          $installerPath = "$env:TEMP\MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath
          Start-Process -FilePath $installerPath -ArgumentList "/silent", "/install" -Wait -PassThru | Out-Null

      - name: Run live WebView fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $source = Get-Content crates\tools\webview\src\main.rs -Raw
          $version = [regex]::Match($source, 'const WEBVIEW2_VERSION: &str = "([^"]+)";').Groups[1].Value
          if (!$version) { throw "WebView2 package pin not found" }
          $cache = if ($env:NUGET_PACKAGES) { $env:NUGET_PACKAGES } else { "$env:USERPROFILE\.nuget\packages" }
          $package = "$cache\Microsoft.Web.WebView2\$version"
          if (!(Test-Path $package)) { $package = "$cache\Microsoft.Web.WebView2.$version" }
          $loader = "$package\build\native\x64"
          if (!(Test-Path "$loader\WebView2Loader.dll")) { throw "Pinned WebView2 loader not found" }
          cargo build -p test-webview --target x86_64-pc-windows-msvc
          $run = "$env:RUNNER_TEMP\webview-x64-debug-$([guid]::NewGuid())"
          New-Item -ItemType Directory "$run\temp" | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\debug\test-webview.exe" "$run\test-webview.exe"
          Copy-Item "$loader\WebView2Loader.dll" "$run\WebView2Loader.dll"
          $env:TEMP = "$run\temp"
          $env:TMP = "$run\temp"
          & "$run\test-webview.exe" --headless --require-runtime
