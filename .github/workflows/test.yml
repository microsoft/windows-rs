name: test

permissions:
  contents: read

on:
  pull_request:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - 'crates/libs/rdl/rdl.md'
      - 'docs/**'
  push:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - 'crates/libs/rdl/rdl.md'
      - 'docs/**'
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - name: stable x64
            host: x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
            runner: windows-2025-vs2026
            clang-exclude: ""
          - name: stable i686
            host: x86_64-pc-windows-msvc
            target: i686-pc-windows-msvc
            runner: windows-2025-vs2026
            # The pinned libclang packages do not include an x86 DLL. The native x64 and Arm64
            # jobs cover this host-tool crate; its output is target-independent.
            clang-exclude: "--exclude windows-clang --exclude test_clang"
          - name: stable arm64
            host: aarch64-pc-windows-msvc
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            clang-exclude: ""

    runs-on: ${{ matrix.runner }}

    env:
      RUSTFLAGS: -D warnings

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update toolchain
        run: rustup update --no-self-update stable && rustup default stable-${{ matrix.host }}
      - name: Add toolchain target
        run: rustup target add ${{ matrix.target }}
      - name: Install fmt
        run: rustup component add rustfmt
      - name: Fix environment
        if: runner.os == 'Windows'
        uses: ./.github/actions/fix-environment
        with:
          target: ${{ matrix.target }}
      - name: Install .NET x86 runtimes
        # The windows-2025-vs2026 image ships .NET only for x64/arm64. The
        # i686 C# tests launch win-x86 processes targeting .NET 9 and .NET 10.
        if: matrix.target == 'i686-pc-windows-msvc'
        shell: pwsh
        run: |
          $script = Join-Path $env:RUNNER_TEMP 'dotnet-install.ps1'
          Invoke-WebRequest -UseBasicParsing 'https://dot.net/v1/dotnet-install.ps1' -OutFile $script
          & $script -Channel 9.0 -Runtime dotnet -Architecture x86 -InstallDir "${env:ProgramFiles(x86)}\dotnet"
          & $script -Channel 10.0 -Runtime dotnet -Architecture x86 -InstallDir "${env:ProgramFiles(x86)}\dotnet"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Provision libclang (Windows)
        # Export LIBCLANG_PATH from the pinned NuGet build (the same one the scrapers use) for the
        # windows-clang tests. After rust-cache so the tool-clang build is cache-accelerated.
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=$(cargo run -q -p tool-clang -- path)" >> "$GITHUB_ENV"
        shell: bash
      - name: Test
        # The system Composition graph is excluded because Reactor consumers select the
        # incompatible lifted Composition stack.
        run: |
          $uiControl = @()
          if ("${{ matrix.target }}" -eq "x86_64-pc-windows-msvc") {
            $ErrorActionPreference = "Stop"
            $artifacts = Join-Path $env:RUNNER_TEMP "canvas-test-artifacts.jsonl"
            cargo test --all --target ${{ matrix.target }} ${{ matrix.clang-exclude }} --exclude windows-composition --exclude canvas-standalone --exclude test_composition --exclude composition-standalone --exclude composition-minesweeper --exclude composition-canvas --no-run --message-format=json > $artifacts
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $canvas = Get-Content $artifacts | ConvertFrom-Json |
              Where-Object { $_.reason -eq "compiler-artifact" -and $_.target.name -eq "test_canvas" -and $_.executable } |
              Select-Object -ExpandProperty executable -Last 1
            if (-not $canvas) { throw "Canvas test executable not found" }
            $ui = Get-Content $artifacts | ConvertFrom-Json |
              Where-Object { $_.reason -eq "compiler-artifact" -and $_.target.name -eq "ui" -and $_.package_id -match "#test-reactor@" -and $_.executable } |
              Select-Object -ExpandProperty executable -Last 1
            if (-not $ui) { throw "Reactor UI test executable not found" }
            function Invoke-Canvas($phase) {
              Write-Host "Canvas phase: $phase"
              $process = Start-Process -FilePath $canvas -ArgumentList "--test-threads=4" -NoNewWindow -PassThru
              try {
                if (-not $process.WaitForExit(45000)) {
                  Write-Host "Canvas process $($process.Id) stalled; capturing native dump"
                  "CANVAS_DUMP=1" >> $env:GITHUB_ENV
                  $zip = Join-Path $env:RUNNER_TEMP "procdump.zip"
                  $tools = Join-Path $env:RUNNER_TEMP "procdump"
                  Invoke-WebRequest https://download.sysinternals.com/files/Procdump.zip -OutFile $zip -TimeoutSec 15
                  Expand-Archive $zip $tools -Force
                  $dump = Join-Path $env:RUNNER_TEMP "canvas-hang.dmp"
                  $capture = Start-Process -FilePath "$tools\procdump64.exe" -ArgumentList "-accepteula", "-mm", "$($process.Id)", $dump -NoNewWindow -PassThru
                  try {
                    if (-not $capture.WaitForExit(20000)) { throw "Dump capture exceeded 20 seconds" }
                    if ($capture.ExitCode -ne 0) { throw "Dump capture failed: $($capture.ExitCode)" }
                  } finally {
                    if (-not $capture.HasExited) { $capture.Kill($true); $capture.WaitForExit() }
                    $capture.Dispose()
                  }
                  throw "Canvas stalled during $phase"
                }
                if ($process.ExitCode -ne 0) { throw "Canvas failed during ${phase}: $($process.ExitCode)" }
              } finally {
                if (-not $process.HasExited) { $process.Kill($true); $process.WaitForExit() }
                $process.Dispose()
              }
            }
            $env:WINDOWS_CANVAS_DIAGNOSTICS = "1"
            $originalPath = $env:PATH
            $deps = Split-Path $canvas
            $profile = Split-Path $deps
            $env:PATH = "$deps;$profile;$originalPath"
            Invoke-Canvas "before new Reactor tests"
            foreach ($case in @(
              "process::child_panic_is_reported",
              "process::hung_child_is_terminated",
              "process::early_successful_exit_is_rejected",
              "menu_callback_replacement_and_removal",
              "text_box_native_edit_and_controlled_reset"
            )) {
              Write-Host "Run isolated Reactor test: $case"
              & $ui --exact $case --nocapture
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              Invoke-Canvas "after $case"
            }
            $env:PATH = $originalPath
            $uiControl = @(
              "--",
              "--skip", "menu_callback_replacement_and_removal",
              "--skip", "text_box_native_edit_and_controlled_reset",
              "--skip", "process::child_panic_is_reported",
              "--skip", "process::hung_child_is_terminated",
              "--skip", "process::early_successful_exit_is_rejected"
            )
            Write-Host "Canvas preflight passed; control run excludes only the five new Reactor tests"
          }
          cargo test --all --target ${{ matrix.target }} ${{ matrix.clang-exclude }} --exclude windows-composition --exclude canvas-standalone --exclude test_composition --exclude composition-standalone --exclude composition-minesweeper --exclude composition-canvas @uiControl
      - name: Upload Canvas diagnostic dump
        if: failure() && env.CANVAS_DUMP == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canvas-native-hang
          path: |
            ${{ runner.temp }}\canvas-hang.dmp
            target\x86_64-pc-windows-msvc\debug\deps\test_canvas-*.exe
            target\x86_64-pc-windows-msvc\debug\deps\test_canvas-*.pdb
      - name: Test system Composition stack
        run: cargo test -p windows-canvas -p windows-composition -p canvas-standalone -p test_composition -p composition-standalone -p composition-minesweeper -p composition-canvas --features windows-canvas/system --target ${{ matrix.target }}
      - name: Check diff
        shell: bash
        run: |
          git add -N .
          git diff --exit-code || (echo 'Tests changed code in the repo.'; exit 1)
