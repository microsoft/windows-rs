name: test

permissions:
  contents: read

on:
  pull_request:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - 'crates/libs/rdl/rdl.md'
      - 'docs/**'
  push:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - 'crates/libs/rdl/rdl.md'
      - 'docs/**'
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - name: stable x64
            host: x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
            runner: windows-2025-vs2026
            clang-exclude: ""
          - name: stable i686
            host: x86_64-pc-windows-msvc
            target: i686-pc-windows-msvc
            runner: windows-2025-vs2026
            # The native Clang pair supports x64 and Arm64 hosts, not x86 processes.
            # Both native jobs exercise x86, x64, and Arm64 parsing targets.
            clang-exclude: "--exclude windows-clang --exclude test_clang --exclude test_clang_sys"
          - name: stable arm64
            host: aarch64-pc-windows-msvc
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            clang-exclude: ""

    runs-on: ${{ matrix.runner }}

    env:
      RUSTFLAGS: -D warnings

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update toolchain
        run: rustup update --no-self-update stable && rustup default stable-${{ matrix.host }}
      - name: Add toolchain targets
        # Ordinary metadata fixtures compile generated Rust for all three architectures.
        run: rustup target add i686-pc-windows-msvc x86_64-pc-windows-msvc aarch64-pc-windows-msvc
      - name: Install fmt
        run: rustup component add rustfmt
      - name: Fix environment
        if: runner.os == 'Windows'
        uses: ./.github/actions/fix-environment
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Provision libclang (Windows)
        # Build the pinned libclang/windows_clang pair used by the scrapers and native tests.
        # After rust-cache so the tool-clang build is cache-accelerated.
        if: runner.os == 'Windows'
        run: |
          path=$(cargo run -q -p tool-clang -- path)
          echo "LIBCLANG_PATH=$path" >> "$GITHUB_ENV"
        shell: bash
      - name: Test
        # The system Composition graph is excluded because Reactor consumers select the
        # incompatible lifted Composition stack. Cross-language tests run in interop.yml.
        run: >-
          cargo test --all --target ${{ matrix.target }} ${{ matrix.clang-exclude }}
          --exclude windows-composition --exclude canvas-standalone --exclude test_composition
          --exclude composition-standalone --exclude composition-minesweeper --exclude composition-canvas
          --exclude test_interop --exclude 'csharp-*' --exclude 'robot-*'
      - name: Test system Composition stack
        run: cargo test -p windows-canvas -p windows-composition -p canvas-standalone -p test_composition -p composition-standalone -p composition-minesweeper -p composition-canvas --features windows-canvas/system --target ${{ matrix.target }}
      - name: Check diff
        shell: bash
        run: |
          git add -N .
          git diff --exit-code || (echo 'Tests changed code in the repo.'; exit 1)
